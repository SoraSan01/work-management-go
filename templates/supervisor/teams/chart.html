{{ define "supervisor/teams/chart.html" }}
{{ template "supervisor-header" . }}

<div class="space-y-6">
  <div class="rounded-2xl border border-gray-200 bg-white shadow-sm">
    <div id="chartToolbar" class="sticky top-0 z-10 flex items-center gap-2 rounded-t-2xl border-b border-gray-200 bg-white/90 p-3 backdrop-blur">
      <button id="zoomIn" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">+</button>
      <button id="zoomOut" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">-</button>
      <button id="reset" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">Reset</button>
      <button id="fit" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">Fit</button>
      <button id="export" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">Export PNG</button>
      <button id="fullscreen" class="ml-auto rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm transition hover:bg-gray-50">Fullscreen</button>
    </div>
    <div class="chart-container h-[500px] overflow-auto rounded-b-2xl bg-gray-50"
         data-chart-api="/supervisor/teams/chart/api/orgchart"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-org-chart@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
<script src="/static/js/employee/chart.js"></script>

{{ template "supervisor-footer" . }}
{{ end }}
