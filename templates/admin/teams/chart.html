{{ define "admin/teams/chart.html" }}
{{ template "admin-header" . }}

<div class="space-y-6">

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 relative">

    <!-- Toolbar -->
    <div id="chartToolbar"
         class="sticky top-0 z-10 flex items-center gap-2
                bg-white/90 backdrop-blur
                border-b border-gray-200
                p-3 rounded-t-2xl">

      <button id="zoomIn" class="tool-btn">＋</button>
      <button id="zoomOut" class="tool-btn">－</button>
      <button id="reset" class="tool-btn">Reset</button>
      <button id="fit" class="tool-btn">Fit</button>
      <button id="export" class="tool-btn">Export PNG</button>
      <button id="fullscreen" class="tool-btn ml-auto">Fullscreen</button>
    </div>

    <!-- Chart -->
    <div class="chart-container grid-bg h-[500px] md:h-[500px] rounded-b-2xl overflow-auto"></div>

  </div>
</div>

<style>
.grid-bg {
  background-color: #f9fafb2a;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}

/* toolbar buttons */
.tool-btn {
  @apply px-3 py-1.5 text-sm rounded-lg border border-gray-200 bg-white hover:bg-gray-50 active:scale-95 transition;
}
</style>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-org-chart@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>

<script>
let chart;
let zoomLevel = 0.7; // define initial zoom

// Fetch org chart data
fetch('/admin/teams/chart/api/orgchart')
  .then(res => res.json())
  .then(data => {
    chart = new d3.OrgChart()
      .container('.chart-container')
      .data(data)
      .nodeWidth(() => 250)
      .nodeHeight(() => 175)
      .childrenMargin(() => 40)
      .compactMarginBetween(() => 15)
      .compactMarginPair(() => 80)
      .initialZoom(zoomLevel)
      .nodeContent(d => `
        <div class="h-full w-full p-3">
          <div class="
            h-full w-full
            bg-white
            rounded-2xl
            shadow-md
            border border-gray-200
            flex flex-col items-center justify-center
            text-center
            hover:shadow-lg
            transition
          ">
            <!-- Avatar -->
            <div class="
              w-14 h-14
              rounded-full
              bg-indigo-100
              text-indigo-600
              flex items-center justify-center
              font-semibold text-lg
              mb-3
            ">
              ${d.data.name?.charAt(0) ?? "U"}
            </div>
            <!-- Name -->
            <div class="font-semibold text-gray-900 text-sm">${d.data.name}</div>
            <!-- Position -->
            <div class="mt-2 px-2 py-0.5 text-[10px] rounded-full bg-gray-100 text-gray-600">
              ${d.data.positionName}
            </div>
          </div>
        </div>
      `)
      .render();
  });

// Zoom helper
const zoom = delta => {
  if (!chart) return;
  zoomLevel = Math.max(0.2, Math.min(2, zoomLevel + delta));
  chart.zoom(zoomLevel);
};

// Toolbar events
document.getElementById('zoomIn').onclick  = () => zoom(0.1);
document.getElementById('zoomOut').onclick = () => zoom(-0.1);
document.getElementById('reset').onclick = () => {
  zoomLevel = 0.7;
  chart.zoom(zoomLevel).center();
};
document.getElementById('fit').onclick = () => chart.fit();

// Export PNG
document.getElementById('export').onclick = () => {
  chart.exportImg({
    full: true,
    scale: 2,
    onLoad: base64 => {
      const a = document.createElement('a');
      a.href = base64;
      a.download = 'org-chart.png';
      a.click();
    }
  });
};

// Fullscreen
document.getElementById('fullscreen').onclick = () => {
  const el = document.querySelector('.chart-container');
  if (!document.fullscreenElement) el.requestFullscreen();
  else document.exitFullscreen();
};
</script>

<script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>

{{ template "admin-footer" . }}
{{ end }}
