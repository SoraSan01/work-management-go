{{ define "manager-sidebar" }}
<aside id="sidebar" class="fixed top-0 left-0 h-screen w-sidebar bg-white border-r border-gray-200 z-40 -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto custom-scrollbar">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-sm">
        <i class="fas fa-tasks text-white"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h1 class="text-base font-semibold text-gray-900 truncate">Work Management</h1>
        <p class="text-xs text-gray-500">Manager Panel</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="p-3 space-y-1">
    <!-- Dashboard -->
    <a href="/manager/dashboard" 
       class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ if eq .ActivePage "dashboard" }}bg-blue-50 text-blue-600{{ else }}text-gray-700 hover:bg-gray-50{{ end }}">
      <i class="fas fa-tachometer-alt w-5 text-center"></i>
      <span>Dashboard</span>
    </a>

    <!-- Tasks -->
    <div class="nav-group">
      <button type="button" 
              class="nav-toggle w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg transition-colors"
              data-target="tasks-menu"
              aria-controls="tasks-menu"
              aria-expanded="false">
        <div class="flex items-center gap-3">
          <i class="fas fa-check-circle w-5 text-center"></i>
          <span>Tasks</span>
        </div>
        <i class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
      </button>
      <div id="tasks-menu" class="nav-submenu ml-8 mt-1 space-y-1 hidden">
        <a href="/manager/tasks/board" 
           class="block px-3 py-2 text-sm rounded-lg transition-colors {{ if eq .ActivePage "task-board" }}bg-blue-50 text-blue-600{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
          Review Board
        </a>
      </div>
    </div>

    <!-- Projects -->
    <div class="nav-group">
      <button type="button" 
              class="nav-toggle w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg transition-colors"
              data-target="projects-menu"
              aria-controls="projects-menu"
              aria-expanded="false">
        <div class="flex items-center gap-3">
          <i class="fas fa-folder w-5 text-center"></i>
          <span>Projects</span>
        </div>
        <i class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
      </button>
      <div id="projects-menu" class="nav-submenu ml-8 mt-1 space-y-1 hidden">
        <a href="/manager/projects/reviews"
           class="block px-3 py-2 text-sm rounded-lg transition-colors {{ if eq .ActivePage "project-reviews" }}bg-blue-50 text-blue-600{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
          Project Reviews
        </a>
        <a href="/manager/projects/requests"
           class="block px-3 py-2 text-sm rounded-lg transition-colors {{ if eq .ActivePage "project-requests" }}bg-blue-50 text-blue-600{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
          Project Requests
        </a>
      </div>
    </div>

    <!-- Teams -->
    <a href="/manager/teams" 
       class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ if eq .ActivePage "teams" }}bg-blue-50 text-blue-600{{ else }}text-gray-700 hover:bg-gray-50{{ end }}">
      <i class="fas fa-users-cog w-5 text-center"></i>
      <span>Teams</span>
    </a>

    <!-- Events -->
    <a href="/manager/events" 
       class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {{ if eq .ActivePage "events" }}bg-blue-50 text-blue-600{{ else }}text-gray-700 hover:bg-gray-50{{ end }}">
      <i class="fas fa-calendar-alt w-5 text-center"></i>
      <span>Events</span>
    </a>
  </nav>

  <!-- Version Info -->
  <div class="mt-auto p-4 border-t border-gray-100">
    <p class="text-center text-xs text-gray-500">
      <i class="fas fa-info-circle mr-1"></i>
      Version {{ if .AppVersion }}{{ .AppVersion }}{{ else }}1.0.0{{ end }}
    </p>
  </div>
</aside>


  <script src="/static/js/manager/sidebar.js"></script>
{{ end }}
